<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <!-- Folha de estilo embitida ho html-->
    <style>
        /* Comentário em CSS 
           Reset dos componentes do navegador 
        */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* formatação para estilo do corpo do site*/
        body{
            font-family: Arial, Helvetica, sans-serif;
            /* background-color: bisque; */
            background-color: #2b2b2f;
            color: #333;
        }

        header {
            background-color: #f7f5f2;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        header h1{
            /* alterando o tamanho da fonte */
            font-size: 24px;
        }

        header p{
            font-size: 14px;
            /* define o espaco em branco na parte superior do elemento */
            margin-top: 5px;
            /* cor do texto que está dentro do parágrafo do header */
            color: #ccc;
        }

        /* vamos formatar o conteiner principal do nosso site */
        main {
            /* define a largura máxima que um elemento pode ter*/
            max-width: 700px;
            margin: 30px auto;
            background-color: #f7f5f2;
            /* espaçamento superior de 25px e direita de 30px */
            padding: 25px 30px; 
            /* Arredondamento dos cantos*/
            border-radius: 8px;
            /* adicionar sombra no main */
            box-shadow: 0 0 10px rgba(0, 0, 0);
        }

        /* vamos configurar o h2 do main */
        main h2{
            margin-top: 20px;
            color: #333;
            /* essa propriedade cria a linha no H2*/
            border-bottom: 2px solid #080101;
            padding-bottom: 10px;
        }

        /* formatando a classe campo 
        ela vai formatar todos os elementos que tiverem a class = campo*/
        .campo{
            margin-top: 15px;
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        /* vamos aplicar formatação para todos os das da classe campo definidos no html
        */
       .campo input,
       .campo select,
       .campo textarea{
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;            
       } 

       /* Aqui vamos dar um estilo à class linha 
       quero que os componentes que estiverem dentro da div class linha,
       fiquem na mesma linha*/
       .linha{
        display:flex;
        gap: 15px;
       }

       .linha .campo{
        flex: 1;
       }

       /* aplicando estilo na div de foto do cliente */
       .upload-foto {
        margin-top: 15px; /* espacamento inferior */
        padding: 20px; /*espacamento interno da div */
        text-align: center; /* alinhamento da div ao centro */
        border: 2px dashed #d62828; /* borda ao redor da div inteira */
        border-radius: 12px; /*arredonda a borda da div*/
        /*box-shadow: 0 0 10px rgba(0, 0, 0);*/
       }

       .btn-enviar {
        text-decoration: none;
        background-color: #d62828;
        color: white;
        border: none; /* removendo a borda do botao */
        padding: 10px 20px; /*colocando espacamento interno*/
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 20px;
       }

       /* quando o usuario passar o mouse sobre o botao vai alterar a cor de fundo dele e a cor do texto*/
       .btn-enviar:hover{
       /* muda a cor de fundo do botao */
       background-color: #a11d1d;
       /* muda a cor do texto do botao */
       color:white;
       }

       footer{
        background-color: #f7f5f2;
        color: #333;
        text-align: center;
        padding:15px;
        margin-top: 30px;
       }

    </style> 
</head>

<body>
    <!-- cabeçalho do nosso site-->    
    <header>
        <h1>Sistema de Gestão de Clientes</h1>
        <p>Módulo de Cadastro de Pessoas</p>
    </header> 

    <!-- Conteúdo principal do nosso site -->
    <main>
        <h2>Cadastro de Clientes</h2>

        <!-- iniciando o nosso lindo formulário -->
        <form action="#" method="post" enctype="multipart/form-data">
            <div class="upload-foto">
                <label for="foto"> <strong>Foto do Cliente</strong> </label>
                <br><br>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>
            
            <!-- Obter o nome do usuário  -->
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
            </div> 

            <!-- Div dos dados pessoais -->
            <div class="linha">
                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <select id="genero" name="genero">
                        <option value="">Selecione uma das opções</option>
                        <option value="feminino">Feminino</option>
                        <option value="masculino">Masculino</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>

            </div> 

            <!-- DIV dos contatos-->
            <!-- Segunda linha--> 
            <div class="linha">
                <!-- agora colocarei os contatos nesta linha-->
                <div class="campo">
                    <label for="telefone">Telefone</label>    
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div> 

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="email@dominio.com" required>
                </div>
            </div> 

            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro...." required>
            </div>

            <!-- Terceira linha - DAdos de Endereço -->
            <div class="linha">
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite a sua cidade" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">UF</option>
                        <option value="pr">PR</option>
                        <option value="rs">RS</option>
                        <option value="sc">SC</option>
                        <option value="ce">CE</option>
                    </select>
                </div>
            </div>

            <!-- observações -->
            <div class="campo">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes" rows="2" placeholder="Informações adicionais sobre o cliente"></textarea>
            </div> 

            <!-- botão para enviar os dados -->
            <input type="submit" value="Salvar" class="btn-enviar"> 
            <a href="index.html" class="btn-enviar">Voltar à página principal</a>
        </form>
    </main> 

    <!-- rodapé do nosso site-->
    <footer>
        <p>&copy; 2026 Sistema de Gestão de Clientes - Todos os direitos reservados</p>

        <p>Desenvolvido para fins didáticos</p>
    </footer>

</body>
</html>
